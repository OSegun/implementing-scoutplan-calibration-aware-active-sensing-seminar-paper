[project]
name = "scoutplan"
version = "1.0.0"
description = "Calibration-aware active sensing: how classifier calibration error, at fixed accuracy, propagates through an informative path planner under an energy budget"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oluwasegun Odusina" }]
keywords = [
    "reinforcement-learning", "informative-path-planning", "calibration",
    "uncertainty-quantification", "active-sensing", "precision-agriculture",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core simulation is NumPy-only by design: the reproduction claim is that anyone
# can run the full sweep on a free-tier kernel. Adding a dependency here weakens that.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only needed to regenerate the figures; the experiment itself does not import it.
figures = ["matplotlib>=3.7"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/OSegun/scoutplan"
"Implementation phase" = "https://github.com/OSegun/scoutfield"

[project.scripts]
scoutplan = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat modules, deliberately: the study is small enough to read top to bottom, and a
# package hierarchy would add indirection without adding clarity.
[tool.setuptools]
py-modules = [
    "scipy_free", "field", "perception", "env", "agents",
    "experiment", "run_jobs", "make_result_figures", "run",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
